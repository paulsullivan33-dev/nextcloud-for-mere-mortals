site_name: Nextcloud for Mere Mortals
site_description: Plain-language self-hosted file sync and sharing with Nextcloud. Files, photos, calendar, and contacts on a server in your own house, the install done by hand, WebDAV proven end to end, sharing and public links exercised for real, and the backup that is a database plus a folder of files.
site_url: https://paulsullivan33-dev.github.io/nextcloud-for-mere-mortals/
